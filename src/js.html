<script>
    const moneyBRL = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    // Estado da lista/edição
    let currentRows = [];
    let editId = null;
    let orcamentos = [];
    let spentByCat = {}; // gasto do mês por categoria (chave normalizada)
    let catOptions = []; // categorias conhecidas (para os seletores inline/datalist)
    let sugestoes = [];
    let orcDismiss = JSON.parse(localStorage.getItem('orcDismiss') || '[]'); // sugestões rejeitadas
    let contas = [];
    let impParsed = []; // linhas do extrato prontas para importar
    let lembretes = [];
    let lembreteEditando = null;
    let metas = [];
    let metaEditando = null;

    // Paleta categórica validada (fundo escuro, segura p/ daltônicos)
    const CORES_CONTA = ['#3987e5', '#199e70', '#c98500', '#008300', '#9085e9', '#e66767', '#d55181', '#d95926'];
    function donutDataPorConta(porConta) {
      const arr = (porConta || []).filter(x => x.total > 0);
      const top = arr.slice(0, 8).map((x, i) => ({ label: x.conta, value: x.total, color: CORES_CONTA[i] }));
      const resto = arr.slice(8);
      if (resto.length) {
        const s = resto.reduce((a, x) => a + x.total, 0);
        top.push({ label: 'Outros', value: Math.round(s * 100) / 100, color: '#8a8f98' });
      }
      return top;
    }

    // Define o valor de um <select>, criando a opção se ela não existir (ex.: edição)
    function setSelectValue(sel, val) {
      if (val == null) return;
      const has = Array.prototype.some.call(sel.options, o => o.value === val);
      if (!has && val !== '') { const o = document.createElement('option'); o.value = val; o.textContent = val; sel.appendChild(o); }
      sel.value = val;
    }

    // Normaliza categoria (igual ao backend: sem acento, minúsculo, alfanumérico)
    function normCat(s) {
      return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // ---- Máscara de moeda (digita só números, formata em R$) ----
    function formatCentavos(cents) {
      cents = Math.max(0, Math.round(cents || 0));
      return (cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function centsOfEl(el) {
      const d = (el.value || '').replace(/\D/g, '');
      return d ? parseInt(d, 10) : 0;
    }
    function valorCentavos() {
      return centsOfEl(document.getElementById('tValor'));
    }
    function setValorEl(el, n) {
      const cents = Math.round((Number(n) || 0) * 100);
      el.value = cents ? formatCentavos(cents) : '';
    }
    function setValorFromNumber(n) {
      setValorEl(document.getElementById('tValor'), n);
    }

    // ---- Toggle Despesa/Receita ----
    function setNatureza(val) {
      const nat = val === 'Receita' ? 'Receita' : 'Despesa';
      document.getElementById('tNatureza').value = nat;
      document.querySelectorAll('#segNatureza button').forEach(b => {
        b.setAttribute('aria-pressed', b.getAttribute('data-nat') === nat ? 'true' : 'false');
      });
      // Compartilhado só faz sentido em despesa
      const cb = document.getElementById('compartBlock');
      if (cb) {
        if (nat === 'Receita') { cb.style.display = 'none'; setCompart(false); }
        else cb.style.display = '';
      }
      // "É salário?" só faz sentido em receita
      const sb = document.getElementById('salarioBlock');
      if (sb) {
        if (nat === 'Receita') sb.style.display = '';
        else { sb.style.display = 'none'; const s = document.getElementById('tSalario'); if (s) s.checked = false; }
      }
    }

    // ---- Parcelas só aparecem quando Tipo = Parcelado ----
    function toggleParcelas() {
      const show = document.getElementById('tTipo').value === 'Parcelado';
      document.getElementById('parcelasRow').style.display = show ? 'grid' : 'none';
    }

    // ---- Compartilhado (Sim/Não + % rateio) ----
    function setCompart(on) {
      const v = on ? '1' : '0';
      document.getElementById('tCompart').value = v;
      document.querySelectorAll('#segCompart button').forEach(b => {
        b.setAttribute('aria-pressed', b.getAttribute('data-comp') === v ? 'true' : 'false');
      });
      document.getElementById('rateioWrap').style.display = on ? 'block' : 'none';
    }

    // ---- Gráficos em SVG (paleta categórica validada p/ fundo escuro) ----
    // Inter=azul, Itaú=aqua, Conta Simples=amarelo (distinguíveis inclusive p/ daltônicos)
    function renderDonut(el, data) {
      const total = data.reduce((a, d) => a + (d.value > 0 ? d.value : 0), 0);
      const cx = 80, cy = 80, r = 58, sw = 20, circ = 2 * Math.PI * r;
      const gap = total > 0 ? 6 : 0; // respiro de 2px+ entre fatias
      let offset = 0, segs = '';
      if (total <= 0) {
        segs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${sw}"/>`;
      } else {
        data.forEach(d => {
          if (!(d.value > 0)) return;
          const len = (d.value / total) * circ;
          const draw = Math.max(len - gap, 0.5);
          segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${sw}" stroke-dasharray="${draw.toFixed(2)} ${(circ - draw).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${escapeHtml(d.label)}: ${moneyBRL(d.value)}</title></circle>`;
          offset += len;
        });
      }
      const legend = data.filter(d => d.value > 0).map(d =>
        `<div class="lgi"><span class="dot" style="background:${d.color}"></span><span>${escapeHtml(d.label)}</span><b>${moneyBRL(d.value)}</b></div>`
      ).join('') || '<div class="lgi" style="color:var(--muted)">Sem despesas no mês</div>';
      el.innerHTML =
        `<div class="chartRow">
           <svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="Despesas por conta">
             ${segs}
             <text x="80" y="77" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">${moneyBRL(total)}</text>
             <text x="80" y="93" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="9">despesas</text>
           </svg>
           <div class="legend">${legend}</div>
         </div>`;
    }

    function renderBars(el, items) {
      const W = 320, H = 150, padX = 12, padTop = 18, padBot = 24;
      const n = Math.max(items.length, 1);
      const max = Math.max(1, ...items.map(i => i.total));
      const slot = (W - padX * 2) / n;
      const bw = Math.min(slot * 0.6, 42);
      let g = `<line x1="${padX}" y1="${H - padBot}" x2="${W - padX}" y2="${H - padBot}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
      items.forEach((it, i) => {
        const bh = (it.total / max) * (H - padTop - padBot);
        const x = padX + i * slot + (slot - bw) / 2;
        const y = H - padBot - bh;
        const lbl = it.total >= 1000 ? (it.total / 1000).toFixed(1).replace('.', ',') + 'k' : Math.round(it.total);
        g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh, 0).toFixed(1)}" rx="4" fill="#4f8cff"><title>${escapeHtml(it.label)}: ${moneyBRL(it.total)}</title></rect>`;
        if (it.total > 0) g += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="8" font-weight="700">${lbl}</text>`;
        g += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="9">${escapeHtml(it.label)}</text>`;
      });
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Evolução de despesas por mês">${g}</svg>`;
    }

    function renderCategorias(el, items) {
      if (!items || items.length === 0) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Sem despesas no mês</div>';
        return;
      }
      const top = items.slice(0, 6);
      const resto = items.slice(6);
      if (resto.length) {
        const s = resto.reduce((a, i) => a + i.total, 0);
        top.push({ categoria: 'Outros', total: Math.round(s * 100) / 100 });
      }
      const max = Math.max(1, ...top.map(i => i.total));
      el.innerHTML = top.map(i => {
        const w = (i.total / max) * 100;
        return `<div class="catRow">
          <div class="catName" title="${escapeHtml(i.categoria)}">${escapeHtml(i.categoria)}</div>
          <div class="catBarWrap"><div class="catBar" style="width:${w.toFixed(1)}%"></div></div>
          <div class="catVal">${moneyBRL(i.total)}</div>
        </div>`;
      }).join('');
    }

    // ---- Relatório anual ----
    // Barras agrupadas: receitas (verde) x despesas (vermelho) por mês.
    function renderAnualMeses(el, meses) {
      const W = 340, H = 170, padX = 10, padTop = 14, padBot = 26;
      const max = Math.max(1, ...meses.map(m => Math.max(m.receitas, m.despesas)));
      const slot = (W - padX * 2) / 12;
      const bw = Math.min(slot * 0.34, 11);
      let g = `<line x1="${padX}" y1="${H - padBot}" x2="${W - padX}" y2="${H - padBot}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
      meses.forEach((m, i) => {
        const x0 = padX + i * slot + slot / 2;
        const hr = (m.receitas / max) * (H - padTop - padBot);
        const hd = (m.despesas / max) * (H - padTop - padBot);
        const xr = x0 - bw - 1, xd = x0 + 1;
        g += `<rect x="${xr.toFixed(1)}" y="${(H - padBot - hr).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hr, 0).toFixed(1)}" rx="2" fill="#199e70"><title>${escapeHtml(m.label)} · receitas: ${moneyBRL(m.receitas)}</title></rect>`;
        g += `<rect x="${xd.toFixed(1)}" y="${(H - padBot - hd).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hd, 0).toFixed(1)}" rx="2" fill="#e66767"><title>${escapeHtml(m.label)} · despesas: ${moneyBRL(m.despesas)}</title></rect>`;
        g += `<text x="${x0.toFixed(1)}" y="${H - 9}" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="8">${escapeHtml(m.label)}</text>`;
      });
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Receitas e despesas por mês">${g}</svg>`;
    }

    function renderRelatorio(data) {
      const el = document.getElementById('relContent');
      if (!data) { el.innerHTML = ''; return; }
      const t = data.totais || {};
      if (!(t.receitas || t.despesas)) {
        el.innerHTML = `<div style="color:var(--muted); font-size:13px;">Sem lançamentos em ${data.ano}.</div>`;
        return;
      }
      const kpis = `<div class="kpis" style="margin-bottom:14px;">
        <div class="kpi"><div class="name">🟢 Receitas</div><div class="val">${moneyBRL(t.receitas)}</div></div>
        <div class="kpi"><div class="name">🔴 Despesas</div><div class="val">${moneyBRL(t.despesas)}</div></div>
        <div class="kpi"><div class="name">💰 Saldo</div><div class="val ${t.saldo >= 0 ? 'pos' : ''}">${moneyBRL(t.saldo)}</div></div>
        <div class="kpi"><div class="name">📊 Média/mês (despesa)</div><div class="val">${moneyBRL(data.mediaMensalDespesa)}</div><div class="small">${data.mesesComMovimento} mês(es) com movimento</div></div>
      </div>`;
      const topGastos = (data.topGastos || []).map(g =>
        `<div class="saldoRow"><span>${escapeHtml(g.data)} · ${escapeHtml(g.descricao)} <span class="pill">${escapeHtml(g.categoria)}</span></span><b>${moneyBRL(g.valor)}</b></div>`
      ).join('');
      el.innerHTML = kpis
        + `<div class="chartBlock"><div class="chartTitle">📊 Receitas × Despesas por mês</div>`
        + `<div class="legend" style="flex-direction:row; gap:14px; margin-bottom:6px; min-width:0;"><span class="lgi"><span class="dot" style="background:#199e70"></span>Receitas</span><span class="lgi"><span class="dot" style="background:#e66767"></span>Despesas</span></div>`
        + `<div id="relMeses"></div></div>`
        + `<div class="chartBlock"><div class="chartTitle">🗂️ Despesas por categoria (ano)</div><div id="relCat"></div></div>`
        + (topGastos ? `<div class="chartBlock"><div class="chartTitle">🔝 Maiores gastos do ano</div>${topGastos}</div>` : '');
      renderAnualMeses(document.getElementById('relMeses'), data.meses);
      renderCategorias(document.getElementById('relCat'), data.porCategoria);
    }

    function carregarRelatorio(ano) {
      const sel = document.getElementById('relAno');
      const alvo = ano || sel.value || String(new Date().getFullYear());
      document.getElementById('relContent').innerHTML = '<div style="color:var(--muted); font-size:13px;">⏳ Carregando...</div>';
      google.script.run
        .withSuccessHandler(data => {
          const anos = (data.anos && data.anos.length) ? data.anos.slice() : [];
          if (!anos.includes(data.ano)) anos.unshift(data.ano);
          const atual = String(data.ano);
          sel.innerHTML = anos.map(a => `<option value="${a}"${String(a) === atual ? ' selected' : ''}>${a}</option>`).join('');
          renderRelatorio(data);
        })
        .withFailureHandler(err => {
          document.getElementById('relContent').innerHTML = '<div class="msg err" style="display:block;">❌ ' + (err?.message || err) + '</div>';
        })
        .getRelatorioAnual(Number(alvo));
    }

    // ---- Parcelas futuras (projeção) ----
    function renderProjecao(data) {
      const el = document.getElementById('projContent');
      const itens = (data && data.itens) || [];
      if (itens.length === 0) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Nenhuma parcela em aberto neste mês. Lançamentos do tipo <b>Parcelado</b> com parcela atual menor que o total aparecem aqui.</div>';
        return;
      }
      const lista = itens.map(i => `<div class="orcRow">
        <div class="orcTop">
          <div class="orcName">${escapeHtml(i.descricao)} <span class="pill">${escapeHtml(i.parcela)}</span></div>
          <div class="orcVals">${moneyBRL(i.valor)}/mês · faltam ${i.restante}</div>
        </div>
        <div class="orcVals" style="text-align:left;">Restante: <b>${moneyBRL(i.totalRestante)}</b></div>
      </div>`).join('');
      el.innerHTML =
        `<div class="projTotal">Total ainda a pagar em parcelas: <b>${moneyBRL(data.totalRestante)}</b></div>
         <div class="chartTitle" style="margin-top:12px;">📅 Comprometido nos próximos meses</div>
         <div id="projChartInner"></div>
         <div style="margin-top:12px;">${lista}</div>`;
      renderBars(document.getElementById('projChartInner'), data.meses || []);
    }

    // ---- Compartilhado / acerto de contas ----
    function renderCompartilhado(data) {
      const el = document.getElementById('compContent');
      const itens = (data && data.itens) || [];
      if (itens.length === 0) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Nenhum gasto compartilhado neste mês. Marque serviços como compartilhados na aba <b>Servicos</b> da planilha.</div>';
        return;
      }
      const pctOutra = Math.round((data.rateio || 0) * 100);
      const lista = itens.map(i => `<div class="orcRow">
        <div class="orcTop">
          <div class="orcName">${escapeHtml(i.descricao)} <span class="pill">🏦 ${escapeHtml(i.conta)}</span> <span class="pill">${Math.round((i.rateio || 0) * 100)}%</span></div>
          <div class="orcVals">${moneyBRL(i.valor)} → ${moneyBRL(i.reembolso)}</div>
        </div>
      </div>`).join('');
      el.innerHTML =
        `<div class="projTotal">Total compartilhado: <b>${moneyBRL(data.total)}</b></div>
         <div class="compAcerto">💸 A outra pessoa te reembolsa: <b>${moneyBRL(data.reembolso)}</b> <span class="sugSub">(${pctOutra}% do compartilhado)</span></div>
         <div style="margin-top:12px;">${lista}</div>`;
    }

    // ---- Importar extrato (CSV) ----
    function parseCSV(text) {
      text = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
      if (!text) return [];
      const primeira = text.split('\n')[0];
      const delim = (primeira.split(';').length > primeira.split(',').length) ? ';' : ',';
      const rows = []; let row = []; let cur = ''; let inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
          else cur += ch;
        } else {
          if (ch === '"') inQ = true;
          else if (ch === delim) { row.push(cur); cur = ''; }
          else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else cur += ch;
        }
      }
      row.push(cur); rows.push(row);
      return rows;
    }

    function parseValorBR(s) {
      s = String(s == null ? '' : s).trim();
      if (!s) return NaN;
      const neg = /^-/.test(s) || /^\(.*\)$/.test(s);
      s = s.replace(/[^\d.,]/g, '');
      if (s.indexOf(',') !== -1 && s.indexOf('.') !== -1) s = s.replace(/\./g, '').replace(',', '.');
      else if (s.indexOf(',') !== -1) s = s.replace(',', '.');
      const n = parseFloat(s);
      if (isNaN(n)) return NaN;
      return neg ? -n : n;
    }

    function parseDataISO(s) {
      s = String(s == null ? '' : s).trim();
      let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      m = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/.exec(s);
      if (m) { let y = m[3]; if (y.length === 2) y = '20' + y; return `${y}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`; }
      return null;
    }

    // Detecta se o conteúdo é um extrato OFX (padrão dos apps de banco).
    function isOFX(text) {
      return /OFXHEADER|<OFX>|<STMTTRN>/i.test(String(text || ''));
    }

    // Extrai um NOME LIMPO + o TIPO da transação a partir do MEMO/NAME do OFX.
    // No extrato do banco o MEMO vem como  <tipo>: "<descrição real entre aspas>",
    // ex.:  Compra no debito: "No estabelecimento DROGASIL 1371 BRASILIA BRA".
    // Queremos guardar só "DROGASIL 1371 BRASILIA BRA" (o que dá pra categorizar)
    // e devolver o tipo ("Compra no debito") para categorizar por tipo no servidor.
    function limparDescricaoOFX(memo, name) {
      memo = String(memo || '').trim();
      name = String(name || '').trim();
      const nm = memo.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      const TIPOS = ['compra no debito', 'compra no credito', 'pix enviado devolvido',
        'pix enviado', 'pix recebido', 'transferencia recebida', 'transferencia enviada',
        'pagamento efetuado', 'aplicacao', 'resgate'];
      let tipo = '';
      const ci = memo.indexOf(':');
      if (ci > 0 && ci <= 40) tipo = memo.slice(0, ci).trim();
      else { for (const tp of TIPOS) { if (nm.indexOf(tp) === 0) { tipo = memo.slice(0, tp.length).trim(); break; } } }
      // Base da descrição: o texto entre aspas; senão o memo sem o prefixo de tipo; senão NAME.
      let base = '';
      const q = /"([^"]*)"/.exec(memo);
      if (q) base = q[1];
      else if (tipo) base = memo.slice(tipo.length).replace(/^[:\s-]+/, '');
      else base = memo;
      base = base
        .replace(/^no estabelecimento\s+/i, '')   // compras: "No estabelecimento X" -> "X"
        .replace(/^cp\s*:?\s*\d+\s*-?\s*/i, '')    // pix: "Cp :78414067-Fulano" -> "Fulano"
        .replace(/^\d{4,}\s+\d+\s+/, '')           // pix: "00019 48511358 EVOGE" -> "EVOGE"
        .replace(/\s{2,}/g, ' ')
        .trim();
      if (!base) base = name || memo || 'Lançamento';
      return { descricao: base, tipo: tipo };
    }

    // Parser de OFX tolerante: funciona tanto no OFX v1 (SGML, sem tags de
    // fechamento) quanto no v2 (XML). Lê cada <STMTTRN> (transação) e extrai
    // data (DTPOSTED), valor (TRNAMT), descrição (limpa) e tipo (para categorizar).
    function parseOFX(text) {
      text = String(text || '');
      let blocks = text.match(/<STMTTRN>[\s\S]*?<\/STMTTRN>/gi);
      if (!blocks || !blocks.length) {
        // OFX SGML sem </STMTTRN>: quebra manualmente pelos marcadores de abertura.
        const parts = text.split(/<STMTTRN>/i).slice(1);
        blocks = parts.map(p => '<STMTTRN>' + p.split(/<\/BANKTRANLIST>|<STMTTRN>/i)[0]);
      }
      const val = (b, name) => {
        const m = new RegExp('<' + name + '>\\s*([^<\\r\\n]*)', 'i').exec(b);
        return m ? m[1].trim() : '';
      };
      const out = [];
      blocks.forEach(b => {
        const dt = val(b, 'DTPOSTED');
        const amt = val(b, 'TRNAMT');
        if (!/^\d{8}/.test(dt)) return;
        const v = parseValorBR(String(amt).replace(/\s/g, ''));
        if (isNaN(v) || v === 0) return;
        const iso = dt.slice(0, 4) + '-' + dt.slice(4, 6) + '-' + dt.slice(6, 8);
        const info = limparDescricaoOFX(val(b, 'MEMO'), val(b, 'NAME'));
        out.push({ data: iso, descricao: info.descricao, tipoOFX: info.tipo, valor: Math.abs(v), natureza: v < 0 ? 'Despesa' : 'Receita' });
      });
      return out;
    }

    // Detecta o formato QIF (exportação de vários bancos/finance apps).
    function isQIF(text) {
      const t = String(text || '');
      return /^\s*!Type:/i.test(t) || (/(^|\n)D/.test(t) && /(^|\n)T/.test(t) && /(^|\n)\^/.test(t));
    }

    // Parser de QIF: registros terminam em "^"; D=data, T/U=valor, P=beneficiário, M=memo.
    function parseQIF(text) {
      const out = [];
      const lines = String(text || '').split(/\r\n|\r|\n/);
      let cur = null;
      const flush = () => {
        if (cur && cur.data && !isNaN(cur.valor) && cur.valor !== 0) {
          const iso = parseDataISO(cur.data);
          if (iso) out.push({ data: iso, descricao: (cur.desc || 'Lançamento').trim(), valor: Math.abs(cur.valor), natureza: cur.valor < 0 ? 'Despesa' : 'Receita' });
        }
        cur = null;
      };
      lines.forEach(ln => {
        if (!ln) return;
        const code = ln.charAt(0), val = ln.slice(1).trim();
        if (code === '^') { flush(); return; }
        if (code === '!') return; // cabeçalho (!Type:Bank)
        if (!cur) cur = { data: '', valor: NaN, desc: '' };
        if (code === 'D') cur.data = val.replace(/'/g, '/').replace(/\s+/g, '');
        else if (code === 'T' || code === 'U') { if (isNaN(cur.valor)) cur.valor = parseValorBR(val); }
        else if (code === 'P') cur.desc = val;
        else if (code === 'M' && !cur.desc) cur.desc = val;
      });
      flush();
      return out;
    }

    // Desenha a prévia da importação (comum a CSV, OFX e QIF).
    function renderImportPreview(invalidas, fonte) {
      const btnImp = document.getElementById('btnImportar');
      const el = document.getElementById('impPreview');
      if (!impParsed.length) {
        el.innerHTML = '<div style="color:var(--muted);font-size:13px;">Nenhuma linha válida encontrada.</div>';
        btnImp.style.display = 'none';
        return;
      }
      const amostra = impParsed.slice(0, 5).map(t =>
        `<div class="saldoRow"><span>${escapeHtml(t.data)} · ${escapeHtml(t.descricao)} <span class="pill">${t.natureza === 'Despesa' ? '🔴' : '🟢'}</span></span><b>${moneyBRL(t.valor)}</b></div>`
      ).join('');
      el.innerHTML = `<div class="chartTitle">Prévia (${fonte}): ${impParsed.length} lançamento(s)${invalidas ? ` · ${invalidas} linha(s) ignorada(s)` : ''}</div>`
        + amostra + (impParsed.length > 5 ? `<div class="hint">…e mais ${impParsed.length - 5}.</div>` : '');
      setMsg('msgImportar', '', 'ok');
      btnImp.style.display = '';
    }

    function preImportar() {
      const txt = document.getElementById('impTexto').value;
      const btnImp = document.getElementById('btnImportar');

      // Formato OFX (extrato dos apps de banco)
      if (isOFX(txt)) {
        impParsed = parseOFX(txt);
        if (!impParsed.length) { setMsg('msgImportar', '❌ OFX sem transações reconhecidas.', 'err'); btnImp.style.display = 'none'; return; }
        renderImportPreview(0, 'OFX');
        return;
      }

      // Formato QIF
      if (isQIF(txt)) {
        impParsed = parseQIF(txt);
        if (!impParsed.length) { setMsg('msgImportar', '❌ QIF sem transações reconhecidas.', 'err'); btnImp.style.display = 'none'; return; }
        renderImportPreview(0, 'QIF');
        return;
      }

      // Formato CSV (com detecção de colunas por banco)
      const rows = parseCSV(txt);
      if (rows.length < 2) { setMsg('msgImportar', '❌ Arquivo vazio ou sem linhas de dados.', 'err'); btnImp.style.display = 'none'; return; }
      const header = rows[0].map(normCat);
      const find = (...cands) => header.findIndex(h => cands.some(c => h.indexOf(c) !== -1));
      const iData = find('data', 'date', 'dt');
      const iDesc = find('descri', 'histor', 'lancament', 'memo', 'titulo', 'estabelecimento', 'detalhe');
      const iValor = find('valor', 'montante', 'amount', 'quantia', 'value');
      // Bancos que separam entrada/saída em duas colunas
      const iDeb = iValor < 0 ? find('debito', 'saida', 'pagamento', 'debit', 'despesa') : -1;
      const iCred = iValor < 0 ? find('credito', 'entrada', 'deposito', 'credit', 'receita') : -1;
      if (iData < 0 || iDesc < 0 || (iValor < 0 && iDeb < 0 && iCred < 0)) {
        setMsg('msgImportar', '❌ Não encontrei as colunas Data / Descrição / Valor (ou Débito/Crédito) no cabeçalho.', 'err');
        btnImp.style.display = 'none';
        return;
      }
      impParsed = []; let invalidas = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || (r.length === 1 && !String(r[0]).trim())) continue;
        const iso = parseDataISO(r[iData]);
        let v;
        if (iValor >= 0) {
          v = parseValorBR(r[iValor]);
        } else {
          const deb = iDeb >= 0 ? parseValorBR(r[iDeb]) : NaN;
          const cred = iCred >= 0 ? parseValorBR(r[iCred]) : NaN;
          v = (isNaN(cred) ? 0 : Math.abs(cred)) - (isNaN(deb) ? 0 : Math.abs(deb)); // crédito entra, débito sai
        }
        const desc = String(r[iDesc] || '').trim();
        if (!iso || isNaN(v) || v === 0 || !desc) { invalidas++; continue; }
        impParsed.push({ data: iso, descricao: desc, valor: Math.abs(v), natureza: v < 0 ? 'Despesa' : 'Receita' });
      }
      renderImportPreview(invalidas, iValor < 0 ? 'CSV (débito/crédito)' : 'CSV');
    }

      if (!impParsed.length) { setMsg('msgImportar', '❌ Pré-visualize primeiro.', 'err'); return; }
