      const el = document.getElementById('faturaContent');
      if (!data || data.semConfig) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Nenhum cartão configurado. Na aba <b>Contas</b>, informe o <b>dia de fechamento</b> (e vencimento) de uma conta para ver a fatura aqui.</div>';
        return;
      }
      const cartoes = (data.cartoes || []).filter(c => c.qtd > 0 || c.total > 0);
      if (!cartoes.length) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Sem lançamentos de cartão no ciclo que fecha neste mês.</div>';
        return;
      }
      el.innerHTML = cartoes.map(c => {
        const itens = c.itens.map(i =>
          `<div class="saldoRow"><span>${escapeHtml(i.data)} · ${escapeHtml(i.descricao)}${i.categoria ? ' <span class="pill">' + escapeHtml(i.categoria) + '</span>' : ''}</span><b>${moneyBRL(i.valor)}</b></div>`
        ).join('');
        return `<div class="orcRow" style="margin-bottom:14px;">
          <div class="orcTop">
            <div class="orcName">💳 ${escapeHtml(c.conta)}</div>
            <div class="orcVals"><b>${moneyBRL(c.total)}</b> · ${c.qtd} lançamento(s)</div>
          </div>
          <div class="orcVals" style="text-align:left; margin-bottom:8px;">🔒 Fecha em <b>${escapeHtml(c.fechamentoData)}</b> · 📅 vence em <b>${escapeHtml(c.vencimentoData)}</b></div>
          ${itens}
        </div>`;
      }).join('')
        + `<div class="compAcerto">💳 Total das faturas que fecham neste mês: <b>${moneyBRL(data.totalGeral)}</b></div>`;
    }

    // ---- Regra 50/30/20 ----
    function carregarRegra() {
      google.script.run
        .withSuccessHandler(renderRegra)
        .withFailureHandler(() => { /* silencioso */ })
        .getRegra503020(mesISOatual());
    }

    function renderRegra(data) {
      const el = document.getElementById('regraContent');
      if (!data || !data.total) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Sem despesas no mês para classificar.</div>';
        return;
      }
      const linha = (nome, val, pct, alvo, cor) => {
        const w = Math.max(0, Math.min(pct, 100));
        const ok = pct <= alvo;
        return `<div class="orcRow">
          <div class="orcTop">
            <div class="orcName">${nome} ${ok ? '✅' : '⚠️'}</div>
            <div class="orcVals">${moneyBRL(val)} · <b>${pct}%</b> <span style="color:var(--muted)">/ alvo ${alvo}%</span></div>
          </div>
          <div class="orcBarWrap" style="position:relative;">
            <div class="orcBar" style="width:${w.toFixed(1)}%; background:${cor}"></div>
            <span title="alvo ${alvo}%" style="position:absolute; top:-3px; bottom:-3px; left:${alvo}%; width:2px; background:rgba(255,255,255,.55);"></span>
          </div>
        </div>`;
      };
      let html = linha('🏠 Essencial', data.buckets.essencial, data.pct.essencial, data.alvo.essencial, 'var(--primary)')
        + linha('🎉 Desejo', data.buckets.desejo, data.pct.desejo, data.alvo.desejo, 'var(--warn)')
        + linha('🐷 Poupança', data.buckets.poupanca, data.pct.poupanca, data.alvo.poupanca, 'var(--ok)');
      if (data.buckets.naoClassificado > 0) {
        html += `<div class="hint" style="margin:8px 0;">❔ Não classificado: <b>${moneyBRL(data.buckets.naoClassificado)}</b> (${data.pct.naoClassificado}%) — use os seletores abaixo.</div>`;
      }
      html += '<div class="chartTitle" style="margin-top:12px;">🏷️ Classificar categorias do mês</div>';
      html += data.categorias.map(c => {
        const opt = (v, l) => `<option value="${v}"${c.classe === v ? ' selected' : ''}>${l}</option>`;
        return `<div class="saldoRow">
          <span>${escapeHtml(c.categoria)} <span class="pill">${moneyBRL(c.total)}</span></span>
          <select class="field" data-regra-cat="${escapeHtml(c.categoria)}" style="width:auto; padding:7px 8px; font-size:13px;">
            ${opt('', '—')}${opt('essencial', 'Essencial')}${opt('desejo', 'Desejo')}${opt('poupanca', 'Poupança')}
          </select>
        </div>`;
      }).join('');
      el.innerHTML = html;
    }

    function onRegraChange(e) {
      const sel = e.target.closest('select[data-regra-cat]');
      if (!sel) return;
      const cat = sel.getAttribute('data-regra-cat');
      google.script.run
        .withSuccessHandler(() => carregarRegra())
        .withFailureHandler(err => alert((err && err.message) || err))
        .setClasseCategoria(cat, sel.value);
    }

    // ---- Regras de categoria (termo -> categoria) ----
    let regrasCat = [];
    function carregarRegras() {
      google.script.run
        .withSuccessHandler(items => { regrasCat = items || []; renderRegras(); })
        .withFailureHandler(() => { /* silencioso */ })
        .getRegras();
    }
    function renderRegras() {
      const el = document.getElementById('regrasList');
      if (!regrasCat.length) { el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Nenhuma regra ainda. Crie uma acima (ex.: "giraffas" → Alimentação).</div>'; return; }
      el.innerHTML = regrasCat.map(r => `<div class="saldoRow">
        <span>🔤 <b>${escapeHtml(r.termo)}</b> → ${escapeHtml(r.categoria)}</span>
        <button class="miniBtn danger" data-rgdel="${escapeHtml(r.termo)}" style="flex:0 0 auto; padding:6px 10px;">🗑️</button>
      </div>`).join('');
    }
    function salvarRegra() {
      const termo = document.getElementById('rgTermo').value.trim();
      const cat = document.getElementById('rgCat').value.trim();
      if (!termo || !cat) { setMsg('msgRegra', '❌ Informe o termo e a categoria.', 'err'); return; }
      setMsg('msgRegra', '⏳ Salvando...', 'ok');
      google.script.run
        .withSuccessHandler(res => {
          const n = (res && res.aplicadas) || 0;
          setMsg('msgRegra', `✅ Regra salva!${n ? ' Aplicada a ' + n + ' lançamento(s) já existente(s).' : ''}`, 'ok');
          document.getElementById('rgTermo').value = '';
          document.getElementById('rgCat').value = '';
          carregarRegras();
          carregarCategorias();
          if (n) refresh();
        })
        .withFailureHandler(err => setMsg('msgRegra', '❌ ' + (err?.message || err), 'err'))
        .setRegra(termo, cat);
    }
    function onRegraCatClick(e) {
      const b = e.target.closest('button[data-rgdel]');
      if (!b) return;
      const termo = b.getAttribute('data-rgdel');
      if (!confirm(`Remover a regra "${termo}"?`)) return;
      google.script.run.withSuccessHandler(carregarRegras).withFailureHandler(err => setMsg('msgRegra', '❌ ' + (err?.message || err), 'err')).deleteRegra(termo);
    }
    function renomearCategoria() {
      const de = document.getElementById('rnDe').value.trim();
      const para = document.getElementById('rnPara').value.trim();
      if (!de || !para) { setMsg('msgRenomear', '❌ Informe as duas categorias.', 'err'); return; }
      if (normCat(de) === normCat(para)) { setMsg('msgRenomear', '❌ As categorias são iguais.', 'err'); return; }
      if (!confirm(`Trocar "${de}" por "${para}" em TODOS os lançamentos?`)) return;
      const btn = document.getElementById('btnRenomearCat');
      btn.disabled = true;
      setMsg('msgRenomear', '⏳ Renomeando...', 'ok');
      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          setMsg('msgRenomear', `✅ ${res.atualizadas} lançamento(s) atualizado(s).`, 'ok');
          document.getElementById('rnDe').value = '';
          document.getElementById('rnPara').value = '';
          carregarCategorias();
          refresh();
        })
        .withFailureHandler(err => { btn.disabled = false; setMsg('msgRenomear', '❌ ' + (err?.message || err), 'err'); })
        .renomearCategoria(de, para);
    }
    function recategorizarTudo() {
      const btn = document.getElementById('btnRecategorizar');
      btn.disabled = true;
      setMsg('msgRegra', '⏳ Recategorizando...', 'ok');
      google.script.run
        .withSuccessHandler(res => { btn.disabled = false; setMsg('msgRegra', `✅ ${res.atualizadas} lançamento(s) categorizado(s).`, 'ok'); if (res.atualizadas) refresh(); })
        .withFailureHandler(err => { btn.disabled = false; setMsg('msgRegra', '❌ ' + (err?.message || err), 'err'); })
        .recategorizar();
    }

    // ---- Orçamentos por categoria (gasto vs limite) ----
    function carregarOrcamentos() {
      google.script.run
        .withSuccessHandler(items => { orcamentos = items || []; renderOrcamentos(); })
        .withFailureHandler(() => { /* silencioso */ })
        .getOrcamentos();
    }

    function renderOrcamentos() {
      const el = document.getElementById('orcList');
      if (!orcamentos || orcamentos.length === 0) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Nenhum orçamento definido. Defina limites por categoria acima.</div>';
        return;
      }
      el.innerHTML = orcamentos.map(o => {
        const gasto = spentByCat[normCat(o.categoria)] || 0;
        const pct = o.limite > 0 ? (gasto / o.limite) * 100 : 0;
        const cor = pct > 100 ? 'var(--bad)' : (pct > 80 ? 'var(--warn)' : 'var(--ok)');
        const w = Math.max(0, Math.min(pct, 100));
        return `<div class="orcRow">
          <div class="orcTop">
            <div class="orcName">${escapeHtml(o.categoria)}</div>
            <div class="orcVals">${moneyBRL(gasto)} / ${moneyBRL(o.limite)} · ${pct.toFixed(0)}%</div>
          </div>
          <div class="orcBarWrap"><div class="orcBar" style="width:${w.toFixed(1)}%; background:${cor}"></div></div>
          <div class="orcActions">
            <button class="miniBtn" data-oact="edit" data-cat="${escapeHtml(o.categoria)}" data-lim="${o.limite}">✏️ Editar</button>
            <button class="miniBtn danger" data-oact="del" data-cat="${escapeHtml(o.categoria)}">🗑️ Remover</button>
          </div>
        </div>`;
      }).join('');
    }

    function salvarOrcamento() {
      const cat = document.getElementById('oCategoria').value.trim();
      const lim = centsOfEl(document.getElementById('oLimite')) / 100;
      if (!cat) { setMsg('msgOrc', '❌ Informe a categoria.', 'err'); return; }
      if (!(lim > 0)) { setMsg('msgOrc', '❌ Informe um limite maior que 0.', 'err'); return; }
      setMsg('msgOrc', '⏳ Salvando...', 'ok');
      google.script.run
        .withSuccessHandler(() => {
          setMsg('msgOrc', '✅ Orçamento salvo!', 'ok');
          document.getElementById('oCategoria').value = '';
          document.getElementById('oLimite').value = '';
          carregarOrcamentos();
        })
        .withFailureHandler(err => setMsg('msgOrc', '❌ ' + (err?.message || err), 'err'))
        .setOrcamento(cat, lim);
    }

    function onOrcClick(e) {
      const b = e.target.closest('button[data-oact]');
      if (!b) return;
      const cat = b.getAttribute('data-cat');
      if (b.getAttribute('data-oact') === 'edit') {
        document.getElementById('oCategoria').value = cat;
        setValorEl(document.getElementById('oLimite'), Number(b.getAttribute('data-lim')));
        setMsg('msgOrc', '', 'ok');
        document.getElementById('oCategoria').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        if (!confirm(`Remover o orçamento de "${cat}"?`)) return;
        google.script.run
          .withSuccessHandler(carregarOrcamentos)
          .withFailureHandler(err => setMsg('msgOrc', '❌ ' + (err?.message || err), 'err'))
          .deleteOrcamento(cat);
      }
    }

    function mesISOatual() {
      return `${document.getElementById('mes').value || defaultMonth()}-01`;
    }

    // ---- Metas de economia ----
    function setMetaTipo(tipo) {
      const t = tipo === 'total' ? 'total' : 'mensal';
      document.getElementById('mTipo').value = t;
      document.querySelectorAll('#segMeta button').forEach(b => {
        b.setAttribute('aria-pressed', b.getAttribute('data-mtipo') === t ? 'true' : 'false');
      });
      document.getElementById('mPrazoWrap').style.display = t === 'total' ? '' : 'none';
      document.getElementById('mAlvoLabel').textContent = t === 'total' ? '💲 Valor a juntar' : '💲 Guardar por mês';
    }

    function carregarMetas() {
      google.script.run
        .withSuccessHandler(items => { metas = items || []; renderMetas(); })
        .withFailureHandler(() => { /* silencioso */ })
        .getMetas(mesISOatual());
    }

    function renderMetas() {
      const el = document.getElementById('metasList');
      if (!metas || metas.length === 0) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Nenhuma meta definida. Crie uma acima para acompanhar sua economia.</div>';
        return;
      }
      el.innerHTML = metas.map(m => {
        const pct = m.pct || 0;
        const w = Math.max(0, Math.min(pct, 100));
        const bateu = pct >= 100;
        const cor = bateu ? 'var(--ok)' : (pct < 0 ? 'var(--bad)' : 'var(--primary)');
        const tipoLabel = m.tipo === 'total' ? '🏁 Total' : '📅 Mensal';
        const prazoLabel = (m.tipo === 'total' && m.prazo)
          ? ` · até ${ymLabel(m.prazo)}` + (m.mesesRestantes != null ? ` (${m.mesesRestantes === 0 ? 'último mês' : m.mesesRestantes + ' mês(es)'})` : '')
          : '';
        return `<div class="orcRow">
          <div class="orcTop">
            <div class="orcName">${bateu ? '🏆 ' : ''}${escapeHtml(m.descricao)} <span class="pill">${tipoLabel}</span></div>
            <div class="orcVals">${moneyBRL(m.progresso)} / ${moneyBRL(m.alvo)} · ${pct}%${prazoLabel}</div>
          </div>
          <div class="orcBarWrap"><div class="orcBar" style="width:${w.toFixed(1)}%; background:${cor}"></div></div>
          <div class="orcActions">
            <button class="miniBtn" data-mact="edit" data-id="${escapeHtml(m.id)}">✏️ Editar</button>
            <button class="miniBtn danger" data-mact="del" data-id="${escapeHtml(m.id)}" data-desc="${escapeHtml(m.descricao)}">🗑️ Remover</button>
          </div>
        </div>`;
      }).join('');
    }

    function salvarMeta() {
      const descricao = document.getElementById('mDesc').value.trim();
      const tipo = document.getElementById('mTipo').value;
      const alvo = centsOfEl(document.getElementById('mAlvo')) / 100;
      const prazo = tipo === 'total' ? (document.getElementById('mPrazo').value || '') : '';
      if (!descricao) { setMsg('msgMeta', '❌ Informe a descrição.', 'err'); return; }
      if (!(alvo > 0)) { setMsg('msgMeta', '❌ Informe um valor maior que 0.', 'err'); return; }
      setMsg('msgMeta', '⏳ Salvando...', 'ok');
      google.script.run
        .withSuccessHandler(() => {
          setMsg('msgMeta', '✅ Meta salva!', 'ok');
          cancelarEdicaoMeta();
          carregarMetas();
        })
        .withFailureHandler(err => setMsg('msgMeta', '❌ ' + (err?.message || err), 'err'))
        .setMeta({ id: metaEditando || '', descricao: descricao, tipo: tipo, alvo: alvo, prazo: prazo });
    }

    function iniciarEdicaoMeta(id) {
      const m = metas.find(x => x.id === id);
      if (!m) return;
      metaEditando = id;
      document.getElementById('mDesc').value = m.descricao;
      setMetaTipo(m.tipo);
      setValorEl(document.getElementById('mAlvo'), m.alvo);
      if (m.tipo === 'total') document.getElementById('mPrazo').value = m.prazo || '';
      document.getElementById('btnSalvarMeta').textContent = '💾 Salvar edição da meta';
      document.getElementById('btnCancelarMeta').style.display = '';
      setMsg('msgMeta', '', 'ok');
      document.getElementById('mDesc').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cancelarEdicaoMeta() {
      metaEditando = null;
      document.getElementById('mDesc').value = '';
      document.getElementById('mAlvo').value = '';
      document.getElementById('mPrazo').value = '';
      setMetaTipo('mensal');
      document.getElementById('btnSalvarMeta').textContent = '🏆 Salvar meta';
      document.getElementById('btnCancelarMeta').style.display = 'none';
    }

    function onMetaClick(e) {
      const b = e.target.closest('button[data-mact]');
      if (!b) return;
      const id = b.getAttribute('data-id');
      if (b.getAttribute('data-mact') === 'edit') {
        iniciarEdicaoMeta(id);
      } else {
        if (!confirm(`Remover a meta "${b.getAttribute('data-desc')}"?`)) return;
        google.script.run
          .withSuccessHandler(() => { if (metaEditando === id) cancelarEdicaoMeta(); carregarMetas(); })
          .withFailureHandler(err => setMsg('msgMeta', '❌ ' + (err?.message || err), 'err'))
          .deleteMeta(id);
      }
    }

    // ---- Sugestões de orçamento (aplicar/rejeitar) ----
    function carregarSugestoes(mesISO) {
      google.script.run
        .withSuccessHandler(items => { sugestoes = items || []; renderSugestoes(); })
        .withFailureHandler(() => { /* silencioso */ })
        .getSugestoesOrcamento(mesISO, 3);
    }

    function renderSugestoes() {
      const el = document.getElementById('orcSugestoes');
      const lista = (sugestoes || []).filter(s => orcDismiss.indexOf(normCat(s.categoria)) === -1);
      if (lista.length === 0) { el.innerHTML = ''; return; }
      el.innerHTML = '<div class="sugTitle">💡 Sugestões de orçamento (média dos últimos meses)</div>' +
        lista.map(s => `<div class="sugRow">
          <div class="sugInfo">
            <b>${escapeHtml(s.categoria)}</b> · sugerido ${moneyBRL(s.sugestao)}
            <div class="sugSub">média ${moneyBRL(s.media)}/mês</div>
          </div>
          <div class="sugActions">
            <button class="miniBtn apply" data-sact="apply" data-cat="${escapeHtml(s.categoria)}" data-lim="${s.sugestao}">✔️ Aplicar</button>
            <button class="miniBtn" data-sact="reject" data-cat="${escapeHtml(s.categoria)}">✖️ Rejeitar</button>
          </div>
        </div>`).join('');
    }

    function onSugClick(e) {
      const b = e.target.closest('button[data-sact]');
      if (!b) return;
      const cat = b.getAttribute('data-cat');
      const key = normCat(cat);
      if (b.getAttribute('data-sact') === 'apply') {
        google.script.run
          .withSuccessHandler(() => {
            orcDismiss = orcDismiss.filter(x => x !== key);
            localStorage.setItem('orcDismiss', JSON.stringify(orcDismiss));
            setMsg('msgOrc', `✅ Orçamento de "${cat}" aplicado!`, 'ok');
            carregarOrcamentos();
            carregarSugestoes(mesISOatual());
          })
          .withFailureHandler(err => setMsg('msgOrc', '❌ ' + (err?.message || err), 'err'))
          .setOrcamento(cat, Number(b.getAttribute('data-lim')));
      } else {
        if (orcDismiss.indexOf(key) === -1) orcDismiss.push(key);
        localStorage.setItem('orcDismiss', JSON.stringify(orcDismiss));
        renderSugestoes();
      }
    }

    // ---- Acordeões dos painéis (lembra aberto/fechado por painel) ----
    function initAccordions() {
      document.querySelectorAll('.acc').forEach(sec => {
        const head = sec.querySelector('.accHead');
        const key = 'acc_' + sec.getAttribute('data-acc');
        if (localStorage.getItem(key) === 'collapsed') sec.classList.add('collapsed');
        const sync = () => head.setAttribute('aria-expanded', sec.classList.contains('collapsed') ? 'false' : 'true');
        const toggle = () => {
          sec.classList.toggle('collapsed');
          localStorage.setItem(key, sec.classList.contains('collapsed') ? 'collapsed' : 'open');
          sync();
        };
        sync();
        head.addEventListener('click', (e) => {
          // não alterna se o clique foi num controle dentro do cabeçalho (ex.: Atualizar)
          if (e.target.closest('button, a, input, select')) return;
          toggle();
        });
        head.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
      });
    }

    // ---- Navegação por telas (SPA) ----
    const VIEWS = ['inicio', 'lancar', 'analise', 'planejar', 'config'];
    function showView(v) {
      if (VIEWS.indexOf(v) < 0) v = 'inicio';
      document.querySelectorAll('section[data-view]').forEach(s => {
        s.style.display = (s.getAttribute('data-view') === v) ? '' : 'none';
      });
      document.querySelectorAll('#tabbar button').forEach(b => {
        b.setAttribute('aria-current', b.getAttribute('data-view') === v ? 'page' : 'false');
      });
      document.body.setAttribute('data-view', v); // controla a barra de "Salvar" (só em Lançar)
      localStorage.setItem('activeView', v);
      window.scrollTo(0, 0);
    }

    // Avança/volta o mês pelo cabeçalho (setas), mantendo #mes como fonte da verdade.
    function shiftMonth(delta) {
      const el = document.getElementById('mes');
      const cur = el.value || defaultMonth();
      const p = cur.split('-').map(Number);
      const d = new Date(p[0], p[1] - 1 + delta, 1);
      el.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      refresh();
    }

    function defaultMonth() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      return `${y}-${m}`;
    }

    function setMsg(id, text, type) {
      const el = document.getElementById(id);
      if (!el) return;
      if (!text) {
        el.style.display = 'none';
        el.className = 'msg';
        el.textContent = '';
        return;
      }
      el.style.display = 'block';
      el.className = 'msg ' + (type === 'err' ? 'err' : 'ok');
      el.textContent = text;
    }

    function ymLabel(m) {
      const [y, mo] = m.split('-');
      return `${mo}/${y}`;
    }

    function isDesktop() {
      return window.matchMedia('(min-width: 900px)').matches;
    }

    function applyResponsiveBits() {
      document.getElementById('saveDesktop').style.display = isDesktop() ? 'block' : 'none';
    }

    // Instalar na tela inicial.
    // OBS.: o app roda dentro de um iframe do Apps Script, então o evento
    // beforeinstallprompt normalmente NÃO dispara e o manifest do iframe é
    // ignorado — um PWA "instalável de verdade" não é possível pela URL /exec.
    // O caminho que funciona é "Adicionar à tela inicial"; abaixo mostramos os
    // passos por plataforma. Se por acaso o navegador oferecer instalação nativa
    // (ex.: Chrome no desktop abrindo a página direta), aproveitamos o evento.
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = '';
    });

    function passosInstalacao() {
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
      const isAndroid = /Android/.test(ua);
      if (isIOS) return 'No <b>Safari</b>: toque em <b>Compartilhar</b> (□↑) e depois em <b>Adicionar à Tela de Início</b>.';
      if (isAndroid) return 'No <b>Chrome</b>: toque no menu <b>⋮</b> e escolha <b>Adicionar à tela inicial</b> (ou <b>Instalar app</b>).';
      return 'No navegador: menu <b>⋮</b> → <b>Instalar</b> ou <b>Adicionar à tela inicial</b>. Um ícone será criado para abrir o app rapidinho.';
    }

    function mostrarAjudaInstalacao() {
      document.getElementById('installDesc').innerHTML = passosInstalacao();
      document.getElementById('installPrompt').style.display = 'flex';
    }

    document.getElementById('btnInstall').addEventListener('click', mostrarAjudaInstalacao);

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
      document.getElementById('installPrompt').style.display = 'none';
    });

    document.getElementById('dismissBtn').addEventListener('click', () => {
      document.getElementById('installPrompt').style.display = 'none';
    });

    // Já está aberto em modo standalone (instalado)? Esconde o botão.
    if (window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true) {
      document.getElementById('btnInstall').style.display = 'none';
    }

    function refresh() {
      const m = document.getElementById('mes').value || defaultMonth();
      const mesISO = `${m}-01`;

      document.getElementById('subMes').textContent = ymLabel(m);
      document.getElementById('pillMes').textContent = '📅 ' + ymLabel(m);
      // Botão "Hoje" só aparece quando não estamos no mês atual
      document.getElementById('btnMesHoje').style.display = (m === defaultMonth()) ? 'none' : '';

      setMsg('msgResumo', '', 'ok');
      setMsg('msgLista', '', 'ok');
      setKpiLoading(true);
      skeletonCards('txCards', 4);

      google.script.run
        .withSuccessHandler(fillResumo)
        .withFailureHandler(err => { setKpiLoading(false); setMsg('msgResumo', 'Erro ao carregar resumo: ' + (err?.message || err), 'err'); })
        .getResumo(mesISO);

      google.script.run
        .withSuccessHandler(fillTransacoes)
        .withFailureHandler(err => setMsg('msgLista', 'Erro ao carregar transações: ' + (err?.message || err), 'err'))
        .listTransacoes(mesISO);

      google.script.run
        .withSuccessHandler(items => renderBars(document.getElementById('chartEvol'), items))
        .withFailureHandler(() => { /* silencioso: gráfico é secundário */ })
        .getEvolucao(mesISO, 6);

      google.script.run
        .withSuccessHandler(items => {
          spentByCat = {};
          (items || []).forEach(i => { spentByCat[normCat(i.categoria)] = i.total; });
          renderCategorias(document.getElementById('chartCat'), items);
          renderOrcamentos();
        })
        .withFailureHandler(() => { /* silencioso */ })
        .getPorCategoria(mesISO);

      carregarOrcamentos();
      carregarSugestoes(mesISO);
      carregarMetas();
      carregarFatura();
      carregarRegra();

      google.script.run
        .withSuccessHandler(renderProjecao)
        .withFailureHandler(() => { /* silencioso */ })
        .getProjecaoParcelas(mesISO, 6);

      google.script.run
        .withSuccessHandler(renderCompartilhado)
        .withFailureHandler(() => { /* silencioso */ })
        .getCompartilhados(mesISO);
    }

    function fillResumo(r) {
      setKpiLoading(false);
      saldosResumo = r.saldosConta || [];
      renderSaldosConta();
      const set = (id, v) => { document.getElementById(id).textContent = moneyBRL(v); };
      set('cGeral', r.totalGeral);
      set('cCompart', r.totalCompart);
      set('cReemb', r.reembolso);
      set('cAjust', r.totalAjustado);
      set('cSaldo', r.saldoAtual);
      set('cPrev', r.prevFinal);
      set('cSalario', r.salario);
      set('cReceitas', r.totalReceitas || 0);

      const pct = (r.pctSalario || 0) * 100;
      document.getElementById('cPct').textContent = pct.toFixed(1) + '% do salário';
      const bar = document.getElementById('cPctBar');
      bar.style.width = Math.max(0, Math.min(pct, 100)) + '%';
      bar.style.background = pct > 100 ? 'var(--bad)' : (pct > 70 ? 'var(--warn)' : 'var(--ok)');

      // Previsão final colorida (verde se positiva, vermelha se negativa)
      document.getElementById('cPrev').style.color = (r.prevFinal < 0) ? 'var(--bad)' : 'var(--ok)';

      // Gráfico de rosca: despesas por conta (dinâmico)
      renderDonut(document.getElementById('chartConta'), donutDataPorConta(r.porConta));
    }

    function fillTransacoes(rows) {
      currentRows = rows || [];
      renderList();
    }

    function matchesQuery(r, q) {
      if (!q) return true;
      return (r.descricao + ' ' + r.conta + ' ' + r.meio + ' ' + r.tipo + ' ' + (r.categoria || '') + ' ' + (r.obs || ''))
        .toLowerCase().includes(q);
    }

    function renderList() {
      const q = (document.getElementById('busca').value || '').trim().toLowerCase();
      const rows = currentRows.filter(r => matchesQuery(r, q));

      const tb = document.getElementById('tb');
      tb.innerHTML = '';
      const cards = document.getElementById('txCards');
      cards.innerHTML = '';

      if (rows.length === 0) {
        const txt = currentRows.length === 0
          ? '📭 Nenhuma transação lançada neste mês.'
          : '🔎 Nada encontrado para a busca.';
        const empty = document.createElement('div');
        empty.className = 'txCard';
        empty.innerHTML = `<div style="color: rgba(255,255,255,.78); font-size:13px; text-align:center;">${txt}</div>`;
        cards.appendChild(empty);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="9" style="color: rgba(255,255,255,.75); padding:14px; text-align:center;">${txt}</td>`;
        tb.appendChild(tr);
        return;
      }

      rows.forEach(r => {
        const receita = r.natureza === 'Receita';
        const sinal = receita ? '+' : '';
        const dot = receita ? '<span class="dot pos" title="Receita">🟢</span>' : '<span class="dot neg" title="Despesa">🔴</span>';
        const rec = r.tipo === 'Recorrente';
        const recSelo = rec ? ' <span class="pill rec" title="Recorrente">🔄 Recorrente</span>' : '';
        const recBtn = `<button class="miniBtn recBtn${rec ? ' on' : ''}" data-act="rec" data-id="${escapeHtml(r.id)}" title="${rec ? 'É recorrente — clique p/ tornar Único' : 'Marcar como recorrente (repete todo mês)'}">🔄</button>`;

        // desktop
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(r.data)}</td>
          <td>${escapeHtml(r.conta)}</td>
          <td>${escapeHtml(r.meio)}</td>
          <td><strong>${dot} ${escapeHtml(r.descricao)}</strong>${recSelo}<div class="catInlineWrap">${catSelectHtml(r)}</div></td>
          <td>${escapeHtml(r.tipo)}</td>
          <td>${escapeHtml(r.parcela || '')}</td>
          <td><strong class="${receita ? 'pos' : ''}">${sinal}${moneyBRL(r.valor)}</strong></td>
          <td>${escapeHtml(r.obs || '')}</td>
          <td><div class="rowBtns">
            ${recBtn}
            <button data-act="edit" data-id="${escapeHtml(r.id)}" title="Editar">✏️</button>
            <button data-act="del" data-id="${escapeHtml(r.id)}" class="danger" title="Excluir">🗑️</button>
          </div></td>
        `;
        tb.appendChild(tr);

        // mobile
        const c = document.createElement('div');
        c.className = 'txCard ' + (receita ? 'receita' : 'despesa');
        c.innerHTML = `
          <div class="txTop">
            <div>
              <p class="txDesc">${dot} ${escapeHtml(r.descricao)}</p>
              <div class="txMeta">
                <span class="pill">📅 ${escapeHtml(r.data)}</span>
                <span class="pill">🏦 ${escapeHtml(r.conta)}</span>
                <span class="pill">💰 ${escapeHtml(r.meio)}</span>
                <span class="pill">${receita ? '🟢 Receita' : '🔴 Despesa'}</span>
                <span class="pill">📝 ${escapeHtml(r.tipo)}${r.parcela ? ' • ' + escapeHtml(r.parcela) : ''}</span>${recSelo}
              </div>
              <div class="catInlineWrap">🗂️ ${catSelectHtml(r)}</div>
            </div>
            <div class="txVal ${receita ? 'pos' : ''}">${sinal}${moneyBRL(r.valor)}</div>
          </div>
          ${r.obs ? `<div class="txObs">📝 ${escapeHtml(r.obs)}</div>` : ``}
          <div class="txActions">
            ${recBtn}
            <button class="miniBtn" data-act="edit" data-id="${escapeHtml(r.id)}">✏️ Editar</button>
            <button class="miniBtn danger" data-act="del" data-id="${escapeHtml(r.id)}">🗑️ Excluir</button>
          </div>
        `;
        cards.appendChild(c);
      });
    }

    // <select> de categoria inline (edição rápida na lista). Inclui a categoria
    // atual mesmo que não esteja na lista conhecida, e uma opção "(sem categoria)".
    function catSelectHtml(r) {
      const atual = r.categoria || '';
      const opts = catOptions.slice();
      if (atual && opts.map(normCat).indexOf(normCat(atual)) === -1) opts.unshift(atual);
      const optionsHtml = ['<option value="">(sem categoria)</option>']
        .concat(opts.map(c => `<option value="${escapeHtml(c)}"${normCat(c) === normCat(atual) ? ' selected' : ''}>${escapeHtml(c)}</option>`))
        .join('');
      return `<select class="catInline" data-catid="${escapeHtml(r.id)}" title="Categoria">${optionsHtml}</select>`;
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", "&#039;");
    }

    // Feedback flutuante (toast). type: 'ok' | 'err' | ''
    function toast(text, type) {
      let wrap = document.getElementById('toastWrap');
      if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toastWrap'; wrap.className = 'toastWrap'; document.body.appendChild(wrap); }
      const el = document.createElement('div');
      el.className = 'toast ' + (type === 'err' ? 'err' : (type === 'ok' ? 'ok' : ''));
      el.setAttribute('role', 'status');
      el.textContent = text;
      wrap.appendChild(el);
      setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 260); }, type === 'err' ? 5000 : 3000);
    }

    // ---- Tema claro/escuro ----
    function applyTheme(theme) {
      const t = theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      const btn = document.getElementById('btnTheme');
      if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'light' ? '#e7e3db' : '#000000');
    }
    function initTheme() {
      let saved = localStorage.getItem('theme');
      if (saved !== 'light' && saved !== 'dark') {
        saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      applyTheme(saved);
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = cur === 'light' ? 'dark' : 'light';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }

    // Skeleton loading enquanto os dados chegam
    function setKpiLoading(on) {
      const k = document.querySelector('.kpis');
      if (k) k.classList.toggle('loading', on);
    }
    function skeletonCards(id, n) {
      const el = document.getElementById(id);
      if (!el) return;
      let h = '';
      for (let i = 0; i < n; i++) h += '<div class="txCard skel"><div class="skLine w60"></div><div class="skLine w30"></div></div>';
      el.innerHTML = h;
    }

    function limpar() {
      document.getElementById('tValor').value = '';
      document.getElementById('tDesc').value = '';
      document.getElementById('tCategoria').value = '';
      document.getElementById('tObs').value = '';
      document.getElementById('tParcAtual').value = '';
      document.getElementById('tParcTotal').value = '';
      document.getElementById('tTipo').value = 'Único';
      document.getElementById('tMeio').value = 'Conta';
      const selConta = document.getElementById('tConta');
      if (selConta.options.length) selConta.selectedIndex = 0;
      document.getElementById('tData').value = new Date().toISOString().slice(0, 10);
      document.getElementById('tRateio').value = 50;
      setNatureza('Despesa');
      setCompart(false);
      toggleParcelas();
      setMsg('msgSalvar', '', 'ok');
      document.getElementById('tDesc').focus();
    }

    // Sai do modo edição (restaura rótulos e esconde botões de cancelar)
    function sairEdicao() {
      editId = null;
      document.getElementById('editBadge').style.display = 'none';
      document.getElementById('btnCancelarEdicao').style.display = 'none';
      document.getElementById('btnCancelarEdicaoDesktop').style.display = 'none';
      document.getElementById('btnSalvar').textContent = '💾 Salvar';
      document.getElementById('btnSalvarDesktop').textContent = '💾 Salvar';
    }

    function cancelarEdicao() {
      sairEdicao();
      limpar();
    }

    // Carrega uma transação no formulário para edição
    function iniciarEdicao(id) {
      const r = currentRows.find(x => x.id === id);
      if (!r) { setMsg('msgSalvar', '❌ Transação não encontrada para editar.', 'err'); return; }
      editId = id;
      document.getElementById('tData').value = r.dataISO || new Date().toISOString().slice(0, 10);
      setValorFromNumber(r.valor);
      document.getElementById('tDesc').value = r.descricao;
      document.getElementById('tCategoria').value = r.categoria || '';
      setSelectValue(document.getElementById('tConta'), r.conta || '');
      document.getElementById('tMeio').value = r.meio || 'Conta';
      document.getElementById('tTipo').value = r.tipo || 'Único';
      setNatureza(r.natureza || 'Despesa');
      document.getElementById('tRateio').value = r.rateio ? Math.round(r.rateio * 100) : 50;
      setCompart(!!r.compartilhado);
      document.getElementById('tParcAtual').value = r.parcelaAtual || '';
      document.getElementById('tParcTotal').value = r.parcelaTotal || '';
      toggleParcelas();
      document.getElementById('tObs').value = r.obs || '';
      document.getElementById('editBadge').style.display = 'block';
      document.getElementById('btnCancelarEdicao').style.display = '';
      document.getElementById('btnCancelarEdicaoDesktop').style.display = '';
      document.getElementById('btnSalvar').textContent = '✏️ Atualizar';
      document.getElementById('btnSalvarDesktop').textContent = '✏️ Atualizar';
      setMsg('msgSalvar', '', 'ok');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.getElementById('tDesc').focus();
    }

    function excluir(id) {
      const r = currentRows.find(x => x.id === id);
      const nome = r ? r.descricao : 'esta transação';
      if (!confirm(`Excluir "${nome}"?\nEsta ação não pode ser desfeita.`)) return;
      setMsg('msgLista', '⏳ Excluindo...', 'ok');
      google.script.run
        .withSuccessHandler(() => { toast('🗑️ Lançamento excluído.', 'ok'); if (editId === id) sairEdicao(); refresh(); })
        .withFailureHandler(err => { const m = '❌ Erro ao excluir: ' + (err?.message || err); setMsg('msgLista', m, 'err'); toast(m, 'err'); })
        .deleteTransacao(id);
    }

    // Delegação de clique nos botões editar/excluir (cards e tabela)
    function gerarRecorrentes() {
      if (!confirm('Lançar os recorrentes deste mês cujo dia já chegou?\n\n'
        + 'Só entram os itens "Recorrente" de meses anteriores cujo dia (<= hoje) já passou, '
        + 'sem duplicar os que já existem. Os do futuro entram sozinhos quando o dia chegar.')) return;
      setMsg('msgLista', '⏳ Gerando recorrentes...', 'ok');
      google.script.run
        .withSuccessHandler(res => {
          const parts = [`✅ ${res.criadas} recorrente(s) lançada(s)`];
          if (res.ignoradas) parts.push(`${res.ignoradas} já existia(m)`);
          if (res.pendentes) parts.push(`${res.pendentes} aguardando o dia`);
          setMsg('msgLista', parts.join(' · ') + '.', 'ok');
          refresh();
        })
        .withFailureHandler(err => setMsg('msgLista', '❌ Erro ao gerar recorrentes: ' + (err?.message || err), 'err'))
        .gerarRecorrentes(mesISOatual());
    }

    // Gera os recorrentes do MÊS ATUAL automaticamente ao abrir o app (idempotente:
    // não duplica os que já existem). Só avisa se realmente criou algo.
    function autoGerarRecorrentes() {
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.criadas > 0) {
            toast(`🔄 ${res.criadas} recorrente(s) lançada(s) automaticamente neste mês.`, 'ok');
            if ((document.getElementById('mes').value || defaultMonth()) === defaultMonth()) refresh();
          }
        })
        .withFailureHandler(() => { /* silencioso */ })
        .gerarRecorrentes();
    }

    // ---- Gatilho automático de recorrentes (mensal, dia 1º) ----
    function carregarStatusGatilhoRec() {
      google.script.run
        .withSuccessHandler(st => atualizarStatusGatilhoRec(st && st.ativo))
        .withFailureHandler(() => {})
        .statusGatilhoRecorrentes();
    }
    function atualizarStatusGatilhoRec(ativo) {
      const btn = document.getElementById('btnToggleGatilhoRec');
      const st = document.getElementById('recStatus');
      if (btn) btn.textContent = ativo ? '🚫 Desativar automático' : '⏰ Gerar automático';
      if (st) st.innerHTML = ativo
        ? '✅ Geração automática <b>ativa</b> — cada recorrente é lançado no dia em que cai.'
        : '⚪ Geração automática desativada. Obs.: ao abrir o app, os recorrentes cujo dia já chegou também são lançados.';
    }
    function toggleGatilhoRec() {
      const btn = document.getElementById('btnToggleGatilhoRec');
      const ativoAgora = btn.textContent.indexOf('Desativar') !== -1;
      btn.disabled = true;
      const fn = ativoAgora ? 'removerGatilhoRecorrentes' : 'instalarGatilhoRecorrentes';
      google.script.run
        .withSuccessHandler(res => { btn.disabled = false; atualizarStatusGatilhoRec(res && res.ativo); setMsg('msgLista', ativoAgora ? '🚫 Automático desativado.' : '✅ Recorrentes automáticos ativados (todo dia 1º)!', 'ok'); })
        .withFailureHandler(err => { btn.disabled = false; setMsg('msgLista', '❌ ' + (err?.message || err), 'err'); })
      [fn]();
    }

    function onListClick(e) {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      const act = btn.getAttribute('data-act');
      if (act === 'edit') abrirEdicao(id);
      else if (act === 'del') excluir(id);
      else if (act === 'rec') toggleRecorrente(id);
    }

    // Mudança na categoria inline (evento change dos <select> da lista)
    function onListChange(e) {
      const sel = e.target.closest('select.catInline');
      if (!sel) return;
      mudarCategoriaInline(sel.getAttribute('data-catid'), sel.value);
    }

    // Grava só a categoria de um lançamento (edição rápida na lista).
    function mudarCategoriaInline(id, categoria) {
      const r = currentRows.find(x => x.id === id);
      if (r) r.categoria = categoria; // otimista (evita re-render que fecharia o select)
      google.script.run
        .withSuccessHandler(() => { toast(categoria ? '🗂️ Categoria: ' + categoria : '🗂️ Categoria removida.', 'ok'); carregarCategorias(); })
        .withFailureHandler(err => { toast('❌ ' + (err?.message || err), 'err'); refresh(); })
        .setCategoriaTransacao(id, categoria);
    }

    // Alterna Recorrente ↔ Único direto na lista.
    function toggleRecorrente(id) {
      const r = currentRows.find(x => x.id === id);
      if (!r) return;
      const novo = r.tipo === 'Recorrente' ? 'Único' : 'Recorrente';
      google.script.run
        .withSuccessHandler(() => {
          toast(novo === 'Recorrente' ? '🔄 Marcado como recorrente (repete todo mês).' : '⚡ Voltou a ser único.', 'ok');
          refresh();
        })
        .withFailureHandler(err => toast('❌ ' + (err?.message || err), 'err'))
        .setTipoTransacao(id, novo);
    }

    // Carrega as categorias conhecidas e atualiza o datalist (#catList) e os selects.
    function carregarCategorias() {
      google.script.run
        .withSuccessHandler(cats => {
          catOptions = cats || [];
          const dl = document.getElementById('catList');
          if (dl) dl.innerHTML = catOptions.map(c => `<option value="${escapeHtml(c)}"></option>`).join('');
          renderCatManager();
        })
        .withFailureHandler(() => {})
        .getCategorias();
    }

    // Gerenciador visual de categorias (chips) no painel de Regras
    function renderCatManager() {
      const el = document.getElementById('catManager');
      if (!el) return;
      if (!catOptions.length) { el.innerHTML = '<span class="hint">Nenhuma categoria ainda.</span>'; return; }
      el.innerHTML = catOptions.map(c =>
        `<span class="catChip"><button type="button" class="catUse" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button><button type="button" class="catDel" data-catdel="${escapeHtml(c)}" title="Remover">✕</button></span>`
      ).join('');
    }

    function onCatManagerClick(e) {
      const use = e.target.closest('button.catUse');
      if (use) { document.getElementById('rgCat').value = use.getAttribute('data-cat'); document.getElementById('rgTermo').focus(); return; }
      const del = e.target.closest('button.catDel');
      if (del) {
        const cat = del.getAttribute('data-catdel');
        if (!confirm(`Remover a categoria "${cat}" da lista?\n(Os lançamentos que já a usam continuam com ela.)`)) return;
        google.script.run
          .withSuccessHandler(() => { toast('🗑️ Categoria removida da lista.', 'ok'); carregarCategorias(); })
          .withFailureHandler(err => setMsg('msgCat', '❌ ' + (err?.message || err), 'err'))
          .deleteCategoria(cat);
      }
    }

    function addNovaCategoria() {
      const nome = document.getElementById('novaCat').value.trim();
      if (!nome) { setMsg('msgCat', '❌ Informe o nome da categoria.', 'err'); return; }
      google.script.run
        .withSuccessHandler(() => {
          document.getElementById('novaCat').value = '';
          setMsg('msgCat', '✅ Categoria criada.', 'ok');
          document.getElementById('rgCat').value = nome;
          carregarCategorias();
        })
        .withFailureHandler(err => setMsg('msgCat', '❌ ' + (err?.message || err), 'err'))
        .setCategoria(nome);
    }

    // ---- Modal de edição de lançamento ----
    let editModalId = null;
    function eEl(id) { return document.getElementById(id); }

    function abrirEdicao(id) {
      const r = currentRows.find(x => x.id === id);
      if (!r) { toast('❌ Lançamento não encontrado.', 'err'); return; }
      editModalId = id;
      eEl('eData').value = r.dataISO || new Date().toISOString().slice(0, 10);
      setValorEl(eEl('eValor'), r.valor);
      eEl('eDesc').value = r.descricao || '';
      eEl('eCategoria').value = r.categoria || '';
      eEl('eNatureza').value = r.natureza === 'Receita' ? 'Receita' : 'Despesa';
      eEl('eConta').innerHTML = eEl('tConta').innerHTML; // reaproveita as contas
      setSelectValue(eEl('eConta'), r.conta || '');
      eEl('eMeio').value = r.meio || 'Conta';
      eEl('eTipo').value = r.tipo || 'Único';
      eEl('eCompart').value = r.compartilhado ? '1' : '0';
      eEl('eRateio').value = r.rateio ? Math.round(r.rateio * 100) : 50;
      eEl('eParcAtual').value = r.parcelaAtual || '';
      eEl('eParcTotal').value = r.parcelaTotal || '';
      eEl('eSalario').checked = normCat(r.categoria) === normCat('Salário');
      eEl('eObs').value = r.obs || '';
      atualizarCamposEdicao();
      setMsg('msgEdit', '', 'ok');
      const dlg = eEl('editDialog');
      if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    }

    function fecharEdicao() {
      editModalId = null;
      const dlg = eEl('editDialog');
      if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
    }

    // Mostra/oculta campos condicionais do modal conforme natureza/tipo/compartilhado
    function atualizarCamposEdicao() {
      const receita = eEl('eNatureza').value === 'Receita';
      eEl('eSalarioWrap').style.display = receita ? '' : 'none';
      eEl('eCompartWrap').style.display = receita ? 'none' : '';
      if (receita) eEl('eCompart').value = '0';
      eEl('eParcelasRow').style.display = eEl('eTipo').value === 'Parcelado' ? 'grid' : 'none';
      eEl('eRateioWrap').style.display = (!receita && eEl('eCompart').value === '1') ? '' : 'none';
    }

    function salvarEdicaoModal() {
      if (!editModalId) return;
      const receita = eEl('eNatureza').value === 'Receita';
      let categoria = eEl('eCategoria').value.trim();
      if (receita && eEl('eSalario').checked) categoria = 'Salário';
      const tipo = eEl('eTipo').value;
      const t = {
        data: eEl('eData').value,
        conta: eEl('eConta').value,
        meio: eEl('eMeio').value,
        descricao: eEl('eDesc').value.trim(),
        categoria: categoria,
        tipo: tipo,
        natureza: eEl('eNatureza').value,
        compartilhado: !receita && eEl('eCompart').value === '1',
        rateio: (Number(eEl('eRateio').value) || 0) / 100,
        parcelaAtual: tipo === 'Parcelado' ? eEl('eParcAtual').value : '',
        parcelaTotal: tipo === 'Parcelado' ? eEl('eParcTotal').value : '',
        valor: centsOfEl(eEl('eValor')) / 100,
        obs: eEl('eObs').value.trim()
      };
      if (!t.descricao) { setMsg('msgEdit', '❌ Informe a descrição.', 'err'); return; }
      if (!(t.valor > 0)) { setMsg('msgEdit', '❌ Informe um valor maior que 0.', 'err'); return; }
      setMsg('msgEdit', '⏳ Salvando...', 'ok');
      eEl('eSalvarBtn').disabled = true;
      google.script.run
        .withSuccessHandler(() => {
          eEl('eSalvarBtn').disabled = false;
          fecharEdicao();
          toast('✅ Lançamento atualizado!', 'ok');
          carregarCategorias();
          refresh();
        })
        .withFailureHandler(err => { eEl('eSalvarBtn').disabled = false; setMsg('msgEdit', '❌ ' + (err?.message || err), 'err'); })
        .updateTransacao(editModalId, t);
    }

    function salvar() {
      const t = {
        data: document.getElementById('tData').value,
        conta: document.getElementById('tConta').value,
        meio: document.getElementById('tMeio').value,
        descricao: document.getElementById('tDesc').value.trim(),
        categoria: document.getElementById('tCategoria').value.trim(),
        tipo: document.getElementById('tTipo').value,
        natureza: document.getElementById('tNatureza').value,
        salario: document.getElementById('tSalario') && document.getElementById('tSalario').checked,
        compartilhado: document.getElementById('tCompart').value === '1',
        rateio: (Number(document.getElementById('tRateio').value) || 0) / 100,
        parcelaAtual: document.getElementById('tParcAtual').value,
        parcelaTotal: document.getElementById('tParcTotal').value,
        valor: valorCentavos() / 100,
        obs: document.getElementById('tObs').value.trim()
      };

      // "É salário" marca a categoria como Salário (usada como base do % do salário)
      if (t.natureza === 'Receita' && t.salario) t.categoria = 'Salário';

      if (!t.descricao) {
        setMsg('msgSalvar', '❌ Informe a descrição.', 'err');
        document.getElementById('tDesc').focus();
        return;
      }
      if (!t.valor || Number(t.valor) <= 0) {
        setMsg('msgSalvar', '❌ Informe um valor maior que 0.', 'err');
        document.getElementById('tValor').focus();
        return;
      }

      if (t.tipo !== 'Parcelado') {
        t.parcelaAtual = '';
        t.parcelaTotal = '';
      }

      const editando = !!editId;

      // Aviso de orçamento: se este gasto deixa a categoria ACIMA do limite
      if (t.natureza === 'Despesa' && t.categoria) {
        const key = normCat(t.categoria);
        const orc = orcamentos.find(o => normCat(o.categoria) === key);
        if (orc && orc.limite > 0) {
          let base = spentByCat[key] || 0;
          if (editando) {
            const orig = currentRows.find(x => x.id === editId);
            if (orig && orig.natureza === 'Despesa' && normCat(orig.categoria) === key) base -= (orig.valor || 0);
          }
          const proj = base + Number(t.valor || 0);
          if (proj > orc.limite) {
            const pct = Math.round(proj / orc.limite * 100);
            const ok = confirm(`⚠️ Este lançamento deixa a categoria "${orc.categoria}" ACIMA do orçamento.\n\n`
              + `Limite: ${moneyBRL(orc.limite)}\nFicará em: ${moneyBRL(proj)} (${pct}%)\n\n`
              + `OK = aplicar mesmo assim\nCancelar = rejeitar o lançamento`);
            if (!ok) { setMsg('msgSalvar', '🚫 Lançamento rejeitado (acima do orçamento).', 'err'); return; }
          }
        }
      }

      setMsg('msgSalvar', editando ? '⏳ Atualizando...' : '⏳ Salvando...', 'ok');
      disableSave(true);

      const req = google.script.run
        .withSuccessHandler(() => {
          setMsg('msgSalvar', '', 'ok');
          toast(editando ? '✅ Lançamento atualizado!' : '✅ Lançamento salvo!', 'ok');
          disableSave(false);
          sairEdicao();
          limpar();
          refresh();
        })
        .withFailureHandler(err => {
          const m = '❌ Erro ao salvar: ' + (err?.message || err);
          setMsg('msgSalvar', m, 'err');
          toast(m, 'err');
          disableSave(false);
        });

      if (editando) req.updateTransacao(editId, t);
      else req.addTransacao(t);
    }

    function disableSave(disabled) {
      const ids = ['btnSalvar', 'btnSalvarDesktop', 'btnLimpar'];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = !!disabled;
      });
    }

    // Bindings
    document.getElementById('mes').value = defaultMonth();
    document.getElementById('tData').value = new Date().toISOString().slice(0, 10);

    document.getElementById('btnAtualizar').addEventListener('click', refresh);
    document.getElementById('btnAtualizar2').addEventListener('click', refresh);
    // Atualiza automaticamente ao trocar o mês de referência
    document.getElementById('mes').addEventListener('change', refresh);

    document.getElementById('btnSalvar').addEventListener('click', salvar);
    document.getElementById('btnSalvarDesktop').addEventListener('click', salvar);
    document.getElementById('btnLimpar').addEventListener('click', cancelarEdicao);
    document.getElementById('btnCancelarEdicao').addEventListener('click', cancelarEdicao);
    document.getElementById('btnCancelarEdicaoDesktop').addEventListener('click', cancelarEdicao);

    // Busca (filtro da lista, client-side)
    document.getElementById('busca').addEventListener('input', renderList);

    // Editar/excluir/recorrente e categoria inline por transação (delegação de evento)
    document.getElementById('txCards').addEventListener('click', onListClick);
    document.getElementById('tb').addEventListener('click', onListClick);
    document.getElementById('txCards').addEventListener('change', onListChange);
    document.getElementById('tb').addEventListener('change', onListChange);
    document.getElementById('btnRecorrentes').addEventListener('click', gerarRecorrentes);

    // Modal de edição
    eEl('eValor').addEventListener('input', (e) => { const c = centsOfEl(e.target); e.target.value = c ? formatCentavos(c) : ''; });
    eEl('eNatureza').addEventListener('change', atualizarCamposEdicao);
    eEl('eTipo').addEventListener('change', atualizarCamposEdicao);
    eEl('eCompart').addEventListener('change', atualizarCamposEdicao);
    eEl('eSalario').addEventListener('change', () => { if (eEl('eSalario').checked) eEl('eCategoria').value = 'Salário'; });
    eEl('eSalvarBtn').addEventListener('click', salvarEdicaoModal);
    eEl('eCancelar').addEventListener('click', fecharEdicao);
    eEl('eClose').addEventListener('click', fecharEdicao);
    eEl('editDialog').addEventListener('cancel', (e) => { e.preventDefault(); fecharEdicao(); });
    document.getElementById('btnToggleGatilhoRec').addEventListener('click', toggleGatilhoRec);

    // Relatório anual
    document.getElementById('btnRelAtualizar').addEventListener('click', () => carregarRelatorio());
    document.getElementById('relAno').addEventListener('change', (e) => carregarRelatorio(e.target.value));

    // Máscara de moeda: reformata a cada tecla
    document.getElementById('tValor').addEventListener('input', (e) => {
      const c = valorCentavos();
      e.target.value = c ? formatCentavos(c) : '';
    });

    // Toggle Despesa/Receita
    document.getElementById('segNatureza').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-nat]');
      if (b) setNatureza(b.getAttribute('data-nat'));
    });

    // Mostrar/ocultar parcelas conforme o Tipo
    document.getElementById('tTipo').addEventListener('change', toggleParcelas);

    // Toggle Compartilhado (Não/Sim)
    document.getElementById('segCompart').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-comp]');
      if (b) setCompart(b.getAttribute('data-comp') === '1');
    });

    // Orçamentos: máscara do limite, salvar e editar/remover
    document.getElementById('oLimite').addEventListener('input', (e) => {
      const c = centsOfEl(e.target);
      e.target.value = c ? formatCentavos(c) : '';
    });
    document.getElementById('btnSalvarOrc').addEventListener('click', salvarOrcamento);
    document.getElementById('orcList').addEventListener('click', onOrcClick);
    document.getElementById('orcSugestoes').addEventListener('click', onSugClick);

    // Metas: máscara do alvo, tipo (segmento), salvar/cancelar e editar/remover
    document.getElementById('mAlvo').addEventListener('input', (e) => {
      const c = centsOfEl(e.target);
      e.target.value = c ? formatCentavos(c) : '';
    });
    document.querySelectorAll('#segMeta button').forEach(b => {
      b.addEventListener('click', () => setMetaTipo(b.getAttribute('data-mtipo')));
    });
    document.getElementById('btnSalvarMeta').addEventListener('click', salvarMeta);
    document.getElementById('btnCancelarMeta').addEventListener('click', cancelarEdicaoMeta);
    document.getElementById('metasList').addEventListener('click', onMetaClick);
    document.getElementById('regraContent').addEventListener('change', onRegraChange);
    document.getElementById('btnSalvarRegra').addEventListener('click', salvarRegra);
    document.getElementById('btnRecategorizar').addEventListener('click', recategorizarTudo);
    document.getElementById('btnRenomearCat').addEventListener('click', renomearCategoria);
    document.getElementById('regrasList').addEventListener('click', onRegraCatClick);
    document.getElementById('catManager').addEventListener('click', onCatManagerClick);
    document.getElementById('btnAddCat').addEventListener('click', addNovaCategoria);
    document.getElementById('novaCat').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addNovaCategoria(); } });

    // Contas
    document.getElementById('contaSaldo').addEventListener('input', (e) => {
      const c = centsOfEl(e.target);
      e.target.value = c ? formatCentavos(c) : '';
    });
    document.getElementById('btnSalvarConta').addEventListener('click', salvarConta);
    document.getElementById('btnCancelarConta').addEventListener('click', cancelarEdicaoConta);
    document.getElementById('contasList').addEventListener('click', onContaClick);
    document.getElementById('btnMesPrev').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('btnMesNext').addEventListener('click', () => shiftMonth(1));
    document.getElementById('pillMes').addEventListener('click', () => showView('inicio'));
    document.getElementById('btnMesHoje').addEventListener('click', () => {
      document.getElementById('mes').value = defaultMonth();
      refresh();
    });
    document.getElementById('btnBackup').addEventListener('click', () => exportarBackup('csv'));
    document.getElementById('btnBackupXml').addEventListener('click', () => exportarBackup('xml'));
    document.getElementById('btnToggleBackup').addEventListener('click', toggleBackup);
    document.getElementById('btnSalvarTelegram').addEventListener('click', salvarTelegram);
    document.getElementById('btnToggleTelegram').addEventListener('click', toggleTelegram);
    document.getElementById('btnVerificarTelegram').addEventListener('click', verificarTelegramAgora);

    // Lembretes
    document.getElementById('lValor').addEventListener('input', (e) => { const c = centsOfEl(e.target); e.target.value = c ? formatCentavos(c) : ''; });
    document.getElementById('btnSalvarLembrete').addEventListener('click', salvarLembrete);
    document.getElementById('btnCancelarLembrete').addEventListener('click', cancelarEdicaoLembrete);
    document.getElementById('lembretesList').addEventListener('click', onLembreteClick);
    document.getElementById('btnToggleGatilho').addEventListener('click', toggleGatilho);
    document.getElementById('btnEnviarLembretes').addEventListener('click', enviarLembretesAgora);

    // Importar extrato
    document.getElementById('btnPreImportar').addEventListener('click', preImportar);
    document.getElementById('btnImportar').addEventListener('click', importarExtrato);
    document.getElementById('impFile').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { document.getElementById('impTexto').value = rd.result; };
      rd.readAsText(f);
    });

    // Tema (antes de tudo, para não piscar)
    initTheme();
    document.getElementById('btnTheme').addEventListener('click', toggleTheme);

    // Estado inicial do formulário
    setNatureza('Despesa');
    setCompart(false);
    toggleParcelas();
    carregarContas();
    carregarLembretes();
    carregarStatusGatilhoRec();
    carregarStatusBackup();
    carregarTelegram();
    carregarRegras();
    carregarCategorias();
    carregarRelatorio();
    autoGerarRecorrentes();
    initAccordions();

    // Navegação por telas: liga os botões e restaura a última tela
    document.querySelectorAll('#tabbar button').forEach(b => {
      b.addEventListener('click', () => showView(b.getAttribute('data-view')));
    });
    showView(localStorage.getItem('activeView') || 'inicio');

    // Atalho no PC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) salvar();
    });

    window.addEventListener('resize', applyResponsiveBits);
    window.addEventListener('load', () => {
      applyResponsiveBits();
      refresh();
    });
  </script>
